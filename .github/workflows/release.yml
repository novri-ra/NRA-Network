name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package Distribution ZIP
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          $zipName = "NRA-Network-$tag.zip"
          $filesToPackage = @("start_benchmark.bat", "dns_benchmark.ps1", "README.md", "LICENSE")
          Compress-Archive -Path $filesToPackage -DestinationPath $zipName -Force
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash
          "$hash  $zipName" | Out-File -FilePath "$zipName.sha256" -Encoding utf8
          Write-Host "Created $zipName with SHA256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NRA-Network ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            NRA-Network-*.zip
            NRA-Network-*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
