name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate PowerShell Scripts
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check PowerShell Syntax (AST Parsing)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Filter *.ps1 -Recurse
          $hasError = $false
          foreach ($file in $files) {
              Write-Host "Parsing $($file.FullName)..."
              $errors = $null
              $tokens = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
              if ($errors -and $errors.Count -gt 0) {
                  Write-Error "Syntax errors in $($file.Name):"
                  $errors | ForEach-Object { Write-Error $_.Message }
                  $hasError = $true
              } else {
                  Write-Host "✓ $($file.Name) syntax is valid." -ForegroundColor Green
              }
          }
          if ($hasError) {
              exit 1
          }

      - name: Verify Batch Script Launcher
        shell: cmd
        run: |
          if not exist "start_benchmark.bat" (
              echo start_benchmark.bat is missing!
              exit /b 1
          ) else (
              echo start_benchmark.bat exists.
          )
