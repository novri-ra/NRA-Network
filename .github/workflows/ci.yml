name: CI - Script Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell scripts (syntax check)
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $errors += "$($_.Name): $($parseErrors.Count) parse error(s)"
              $parseErrors | ForEach-Object { Write-Host "  ERROR: $_" }
            } else {
              Write-Host "OK: $($_.Name)"
            }
          }
          if ($errors.Count -gt 0) {
            Write-Error "Syntax errors found: $($errors -join '; ')"
            exit 1
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Get-ChildItem -Filter *.ps1 -Recurse | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error
          }
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found $($results.Count) error(s)"
            exit 1
          }
          Write-Host "PSScriptAnalyzer: all clear"
